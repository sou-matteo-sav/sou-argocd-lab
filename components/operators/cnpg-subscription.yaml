apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cloudnative-pg
  namespace: openshift-operators
spec:
  channel: stable-v1
  # Approvazione manuale: un upgrade dell'operatore riavvia in rolling ogni instance manager CNPG (riavvii DB),
  # quindi va eseguito in modo controllato e non a ogni refresh del catalogo.
  installPlanApproval: Manual
  name: cloudnative-pg
  source: certified-operators
  sourceNamespace: openshift-marketplace
  startingCSV: cloudnative-pg.v1.30.2 # versione corrente nel catalogo certified-operators del cluster lab
