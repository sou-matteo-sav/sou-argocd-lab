# Red Hat build of Keycloak (da redhat-operators).
# rhbk-operator supporta solo le modalità OwnNamespace/SingleNamespace (non AllNamespaces),
# quindi usa un proprio OperatorGroup nel namespace "keycloak" (creato da components/namespaces).
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhbk-operator
  namespace: keycloak
spec:
  targetNamespaces:
    - keycloak
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: keycloak
spec:
  channel: stable-v26.6
  installPlanApproval: Manual # identity provider: upgrade controllato
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: rhbk-operator.v26.6.9-opr.1 # versione corrente nel catalogo redhat-operators del cluster lab
