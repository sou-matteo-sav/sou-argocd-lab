openshift:
  enabled: true

replicaCount: 1

# Singola replica + [session]/[cache]/[queue] locali su /data -> non eseguire mai due pod Gitea writer insieme
strategy:
  type: Recreate

service:
  http:
    type: ClusterIP
    port: 3000
    clusterIP: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# I subchart integrati e il pod di test restano disabilitati (usiamo il DB CNPG gitea-pg)
postgresql-ha:
  enabled: false
postgresql:
  enabled: false
valkey-cluster:
  enabled: false
valkey:
  enabled: false
test:
  enabled: false

persistence:
  enabled: true
  size: 2Gi
  storageClass: lvms-vg1
  # LVM (topolvm.io) supporta ReadWriteOnce (non RWX); il backup giornaliero usa CSI VolumeSnapshot senza mount
  accessModes:
    - ReadWriteOnce

# Route (solo HTTP/HTTPS). Il chart deriva server.DOMAIN e server.ROOT_URL da route.host.
route:
  enabled: true
  host: gitea.apps.openshift-ai-lab01.ocp-ai.corp.sourcesense.com
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

gitea:
  admin:
    existingSecret: gitea-admin-secret
    email: "admin@example.com"

  config:
    server:
      # Una Route OpenShift non trasporta SSH: clone solo via HTTPS.
      DISABLE_SSH: true
      START_SSH_SERVER: false
      SSH_PORT: 22
      SSH_LISTEN_PORT: 2222
    database:
      DB_TYPE: postgres
      HOST: gitea-pg-rw.gitea.svc.cluster.local:5432
      NAME: gitea
      SSL_MODE: require

  additionalConfigFromEnvs:
    - name: GITEA__database__USER
      valueFrom:
        secretKeyRef:
          name: gitea-pg-app
          key: username
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-pg-app
          key: password
