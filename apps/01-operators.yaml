# Wave 1: installa gli operatori OLM (CloudNativePG + Red Hat Build of Keycloak).
# Entrambe le Subscription usano installPlanApproval: Manual -> dopo il sync di questa Application
# approvare manualmente gli InstallPlan in openshift-operators e keycloak e attendere CSV Succeeded
# prima di sincronizzare le wave 2+.
# Finalizer omesso intenzionalmente per non rimuovere gli operatori in caso di delete dell'Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-cluster-operators
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: "https://github.com/sou-matteo-sav/openshift-argocd-lab.git"
    targetRevision: "main"
    path: components/operators
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
    # Decommentare dopo il bootstrap iniziale per auto-sync continuo:
    # automated:
    #   prune: false
    #   selfHeal: true
