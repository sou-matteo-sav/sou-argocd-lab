# Wave 2: cluster PostgreSQL CNPG per Gitea (gitea-pg), ScheduledBackup (LVM CSI VolumeSnapshot),
# PodMonitor, PrometheusRule e NetworkPolicy.
# Sincronizzare DOPO aver approvato l'InstallPlan di cloudnative-pg (Wave 1).
# Finalizer omesso intenzionalmente: proteggere DB e PVC da eliminazioni in cascata.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-db
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: "https://github.com/sou-matteo-sav/openshift-argocd-lab.git"
    targetRevision: "main"
    path: components/gitea-db
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
    # Decommentare dopo il bootstrap iniziale per auto-sync continuo:
    # automated:
    #   prune: false
    #   selfHeal: true
