# Wave 0: gestisce i namespace applicativi (gitea, keycloak, redis-lab) con label argocd.argoproj.io/managed-by.
# Finalizer omesso intenzionalmente: eliminare questa Application non deve mai eliminare namespace e PVC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-cluster-namespaces
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: "https://github.com/sou-matteo-sav/sou-argocd-lab.git"
    targetRevision: "main"
    path: components/namespaces
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    # Decommentare dopo il bootstrap iniziale per auto-sync continuo:
    automated:
      prune: false
      selfHeal: true
